name: Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - name: Build and verify
        run: ./gradlew assembleDebug test lintRelease assembleRelease
      - name: Sign and prepare release assets
        env:
          KEYSTORE_BASE64: ${{ secrets.SPESE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SPESE_KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export SPESE_KEYSTORE="$RUNNER_TEMP/spese.p12"
          export SPESE_PASSWORD_FILE="$RUNNER_TEMP/spese-password"
          trap 'rm -f "$SPESE_KEYSTORE" "$SPESE_PASSWORD_FILE"' EXIT
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo 'Set the SPESE_KEYSTORE_BASE64 and SPESE_KEYSTORE_PASSWORD repository secrets.'
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SPESE_KEYSTORE"
          printf '%s\n' "$KEYSTORE_PASSWORD" > "$SPESE_PASSWORD_FILE"
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body > "$RUNNER_TEMP/release-notes"
          ci/publish-apk.sh "$RUNNER_TEMP/spese-assets" "$RUNNER_TEMP/release-notes"
          actual="$(jq -r .versionName "$RUNNER_TEMP/spese-assets/version.json")"
          [[ "$GITHUB_REF_NAME" == "v$actual" ]]
      - name: Publish verified archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/spese-assets"
          flags=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" "$assets/spese.apk" "$assets/spese.apk.sha256" "$assets/version.json" \
            --verify-tag --draft --title "Spese ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/release-notes"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/release-check"
          (cd "$RUNNER_TEMP/release-check" && sha256sum --check spese.apk.sha256)
          cmp "$assets/version.json" "$RUNNER_TEMP/release-check/version.json"
          gh release edit "$GITHUB_REF_NAME" --draft=false "${flags[@]}"
